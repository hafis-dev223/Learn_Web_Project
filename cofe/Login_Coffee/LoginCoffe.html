<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Coffe</title>
    <link rel="stylesheet" href="style2.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="container1">
      <div class="text-judul">
        <h2>
          Good Coffee <br />
          Good Days
        </h2>
        <p>
          Murah meriah dan terjangkau <br />
          selamat menikmati
        </p>
      </div>

      <div class="prompt-login">
        <h1>Login</h1>
        <p>Masuk untuk menikmati Coffe Kami</p>

        <div class="Input-username">
          <input type="text" placeholder="Username atau Email" id="ES" />
        </div>

        <div class="Input-password">
          <input type="password" placeholder="password" />
        </div>

        <button onclick="TombolKematian()">Login</button>
      </div>
    </div>
  </body>
  <script>
    lucide.createIcons();
  </script>
</html>
