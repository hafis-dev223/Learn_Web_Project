<!doctype html>
<html lang="e">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffe Shop</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="Icon" href="Taza de café Logo Template _ Vector Premium.jpg" />
  </head>
  <style>
    * {
      margin: 0px;
      padding: 0px;
    }
    body {
      font-family: arial;
      overflow-x: hidden;
    }

    .container1 {
      display: flex;
      border: 1px solid rgba(66, 29, 3);

      margin: 0 px;
      background-color: #2b1e1b;
      justify-content: space-around;
      height: 40px;
      align-items: center;
      padding: 10px 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0px 50px rgba(140, 90, 60, 0.6);
    }

    .container1 nav ul {
      display: flex;
      gap: 50px;
      list-style: none;
      position: sticky;
      margin-right: 0px;
      margin-left: 0px;
      color: aliceblue;
      z-index: 1000;
    }
    .sign {
      margin: 0;
      border: 1px solid rgb(20, 18, 0);
      width: 50px;
      height: 35px;
      border-radius: 100px;
      background: linear-gradient(135deg, #8c5a3c 0%, #e0a96d 100%);
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    .sign:hover {
      transform: translateY(2px);
      box-shadow: 0 6px 15px rgba(224, 169, 109, 0.4);
    }
    .container1 a,
    li {
      color: aliceblue;
      text-decoration: none;
    }

    .container1 nav a:hover,
    .container1 nav a:focus,
    .container1 nav a:active {
      color: #e0a96d;
      text-shadow: 0 0 20px rgba(227, 132, 31, 0.8);
      transition: 0.5s ease;
    }

    .container1 h3 {
      margin: 0px;
      font-size: 1.2rem;
      color: aliceblue;
      margin-top: 15px;
      margin-left: 30px;
      margin-bottom: 15px;
    }

    .logo img {
      height: 40px;
      width: auto;
      border-radius: 100px;
    }

    .logo {
      display: flex;
      gap: 30px;
      text-align: center;
      margin-left: 30px;
    }

    .container2 {
      position: relative;
      width: 200%;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .gambarlogo {
      width: 50%;
      height: 200px;
      object-position: center;
      height: 400px;

      filter: brightness(0.8);
    }

    .hero-text {
      position: absolute;
      top: 15%;
      left: 150px;
      color: #fefefd;
    }

    .text {
      border: 1px solid chocolate;
      border-radius: 100px;
      width: 190px;
      background-color: #2b1e1b;
      text-align: center;
      margin-bottom: 15px;
    }

    .hero-text h2 {
      top: 10%;
      font-size: 40px;
      text-shadow: 0 2px 10px rgba(42, 32, 2, 0.8);
      background: linear-gradient(135deg, #f4e8c1 0%, #e0a96d 50%, #8c5a3c 100%);
      -webkit-background-clip: text;
      filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.8));
      -webkit-text-fill-color: transparent;
    }

    .tombol-custom {
      margin-top: 30px;
      border: 1px solid #2b1e1b;
      padding: 10px 15px;
      border-radius: 100px;
      background: linear-gradient(180deg, rgba(43, 30, 27, 0.85) 0%, rgba(20, 13, 11, 0.95) 100%);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(224, 169, 109, 0.2);
      color: #ffffff;
      transition: all 0.3s ease;
    }

    .tombol-custom:hover {
      background-color: #381f05;
      color: #fffefe;
      transform: translateY(3px);
      box-shadow: 0 8px 20px rgba(224, 169, 109, 0.4);
    }
  </style>
  <body>
    <header>
      <div class="container1">
        <div class="logo">
          <img src="download (8).jpg" alt="Logo_coffe" />
          <h3>braw & been</h3>
        </div>
        <nav>
          <ul>
            <li><a href="#Home">Home</a></li>
            <li><a href="#Menu">Menu</a></li>
            <li><a href="#About">About</a></li>
            <li><a href="#Contact">Contact</a></li>
          </ul>
        </nav>
        <button class="sign">Sign</button>
      </div>
    </header>

    <section class="hero">
      <div class="container2">
        <img src="upscalemedia-transformed.jpeg" alt=" gambarLandingPage" class="gambarlogo" />

        <div class="hero-text">
          <p class="text">Good Coffe, Good Days</p>
          <h2>
            Nikmati Hari Mu Dengan <br />
            Senyum ku Yang Manis
          </h2>
          <p>
            coffe enak dan menghilangkan ngantuk <br />
            biar begadang makin seger
          </p>

          <button class="tombol-custom">Pesan Sekarang &rarr;</button>
        </div>
      </div>
    </section>
  </body>
</html>
